name: Skill lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Stdlib-only linter — no pip install step needed.
      - name: Lint skills (frontmatter / duplicates / dead links / scraping red line)
        run: python3 scripts/lint_skills.py
